name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  # ── Static Analysis (parallel) ──────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci
      - run: npm run lint

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci
      - run: npm run check

  # ── Security (parallel) ─────────────────────────────────────────────────
  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high

  secrets-scan:
    name: Secrets Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: TruffleHog Scan
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

  auth:
    name: Auth Service Checks
    uses: ./.github/workflows/auth.yml

  # ── Tests (runs after lint + typecheck) ─────────────────────────────────
  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      dynamodb:
        image: amazon/dynamodb-local:latest
        ports:
          - 8000:8000
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://user:password@localhost:5432/test_db
      AUTH_DATABASE_URL: postgresql://user:password@localhost:5432/test_auth_db
      WORKSPACE_DATABASE_URL: postgresql://user:password@localhost:5432/test_db
      TEAM_DATABASE_URL: postgresql://user:password@localhost:5432/test_db
      AI_DATABASE_URL: postgresql://user:password@localhost:5432/test_db
      METRICS_DATABASE_URL: postgresql://user:password@localhost:5432/test_db
      CANVAS_DATABASE_URL: postgresql://user:password@localhost:5432/test_db
      DYNAMODB_ENDPOINT: http://localhost:8000
      RUN_DDB_PARITY: "true"
      SESSION_SECRET: ci-test-session-secret-not-used-in-prod
      ENCRYPTION_KEY: ci-test-encryption-key-32-bytes00000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci
      - name: Wait for DynamoDB Local
        run: |
          for i in $(seq 1 15); do
            curl -fsS http://localhost:8000/ && exit 0
            sleep 1
          done
          echo "DynamoDB Local did not become reachable"
          exit 1
      - run: npm run test:coverage
      # SECURITY GUARD: forbid auth bypass flags in runtime code
      - run: ./scripts/no-auth-bypass.sh
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  e2e:
    name: Browser Smoke Test
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://user:password@localhost:5432/test_db
      AUTH_DATABASE_URL: postgresql://user:password@localhost:5432/test_db
      WORKSPACE_DATABASE_URL: postgresql://user:password@localhost:5432/test_db
      TEAM_DATABASE_URL: postgresql://user:password@localhost:5432/test_db
      AI_DATABASE_URL: postgresql://user:password@localhost:5432/test_db
      METRICS_DATABASE_URL: postgresql://user:password@localhost:5432/test_db
      CANVAS_DATABASE_URL: postgresql://user:password@localhost:5432/test_db
      SESSION_SECRET: ci-test-session-secret-not-used-in-prod
      ENCRYPTION_KEY: ci-test-encryption-key-32-bytes00000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --grep "@smoke"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  # ── Build & Package (runs after tests) ──────────────────────────────────
  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: [test, e2e, coverage, auth]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci
      - run: npm run build
        env:
          NODE_ENV: production
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
      - uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: dist/
          retention-days: 14

  docker-verify:
    name: Docker Build Verification
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t meshwork-studio:ci .

  coverage:
    name: Coverage Check
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: coverage/
      - name: Enforce coverage threshold
        run: |
          test -f coverage/coverage-summary.json
          COVERAGE=$(jq -r '.total.lines.pct' coverage/coverage-summary.json)
          # The 80% target remains in plans/CI-CD-AUDIT.md. This baseline is
          # deliberately set from the measured current suite until coverage is
          # raised through focused test work.
          THRESHOLD=46
          echo "Line coverage: ${COVERAGE}%"
          if (( $(echo "$COVERAGE < $THRESHOLD" | bc -l) )); then
            echo "FAIL: Coverage ${COVERAGE}% is below threshold ${THRESHOLD}%"
            exit 1
          fi
          echo "PASS: Coverage ${COVERAGE}% meets threshold ${THRESHOLD}%"

  required-checks:
    name: Required Checks
    runs-on: ubuntu-latest
    if: always()
    needs:
      [
        lint,
        typecheck,
        dependency-audit,
        secrets-scan,
        auth,
        test,
        e2e,
        coverage,
        build,
        docker-verify,
      ]
    steps:
      - name: Require every gate to pass
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          echo "Required job results: $RESULTS"
          IFS=',' read -ra results <<< "$RESULTS"
          for result in "${results[@]}"; do
            test "$result" = "success"
          done
