name: Identity Service

on:
  push:
    branches: [main, develop]
    paths:
      - "services/identity/**"
      - ".github/workflows/identity.yml"
  pull_request:
    paths:
      - "services/identity/**"
      - ".github/workflows/identity.yml"

concurrency:
  group: identity-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: services/identity

env:
  GO_VERSION: "1.24"

jobs:
  lint:
    name: Lint (golangci-lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: services/identity/go.sum
      - uses: golangci/golangci-lint-action@v6
        with:
          working-directory: services/identity

  security:
    name: Security Scan (gosec + govulncheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: services/identity/go.sum
      - name: gosec
        uses: securego/gosec@master
        with:
          workdir: services/identity
          args: ./...
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  test:
    name: Test (race)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: services/identity/go.sum
      - run: go test ./... -race -count=1 -coverprofile=cover.out
      - run: go tool cover -func=cover.out | tail -1

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - name: Build identity image
        run: docker build -t meshwork-identity:${{ github.sha }} .
