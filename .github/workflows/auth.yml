name: Auth Service

on:
  workflow_call:

concurrency:
  group: identity-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: server/services/auth

env:
  GO_VERSION: "1.26.8"

jobs:
  lint:
    name: Lint (golangci-lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: server/services/auth/go.sum
      - uses: golangci/golangci-lint-action@v9
        with:
          working-directory: server/services/auth
          version: v2.13.2

  security:
    name: Security Scan (gosec + govulncheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: server/services/auth/go.sum
      - name: gosec
        uses: securego/gosec@v2.22.10
        with:
          entryPoint: ./server/services/auth
          args: ./...
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          govulncheck ./...

  test:
    name: Test (race)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: server/services/auth/go.sum
      - run: go test ./... -race -count=1 -coverprofile=cover.out
      - run: go tool cover -func=cover.out | tail -1

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - name: Build identity image
        working-directory: server/services/auth
        run: docker build -t meshwork-identity:${{ github.sha }} .
