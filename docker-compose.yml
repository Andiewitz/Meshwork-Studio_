name: emnesh-studio

services:
  emnesh-workspace-db:
    container_name: emnesh-postgres-workspace
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: emnesh_workspace
    ports:
      - '5434:5432'
    volumes:
      - pgdata_workspace:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d emnesh_workspace"]
      interval: 10s
      timeout: 5s
      retries: 5

  emnesh-auth-db:
    container_name: emnesh-postgres-auth
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: emnesh_auth
    ports:
      - '5433:5432'
    volumes:
      - pgdata_auth:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d emnesh_auth"]
      interval: 10s
      timeout: 5s
      retries: 5

  emnesh-redis:
    container_name: emnesh-redis
    image: redis:7-alpine
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  emnesh-backend:
    container_name: emnesh-backend-api
    image: emnesh-app:latest
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - '5000:5000'
    environment:
      DATABASE_URL: postgresql://user:password@emnesh-workspace-db:5432/emnesh_workspace
      WORKSPACE_DATABASE_URL: postgresql://user:password@emnesh-workspace-db:5432/emnesh_workspace
      AUTH_DATABASE_URL: postgresql://user:password@emnesh-auth-db:5432/emnesh_auth
      REDIS_URL: redis://emnesh-redis:6379
      NODE_ENV: production
      # SECURITY: secrets MUST come from the deployment environment (.env /
      # SSM / Vault). No known defaults are accepted anymore.
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET required}
      METRICS_BEARER_TOKEN: ${METRICS_BEARER_TOKEN:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      APP_URL: ${APP_URL:-http://localhost:5000}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    depends_on:
      emnesh-workspace-db:
        condition: service_healthy
      emnesh-auth-db:
        condition: service_healthy
      emnesh-redis:
        condition: service_healthy

  # ─── Auth service (Go) — owns users/sessions/MFA/OAuth/audit ──────────
  emnesh-identity:
    container_name: emnesh-identity
    build:
      context: ./services/auth
      dockerfile: Dockerfile
    restart: always
    environment:
      NODE_ENV: production
      AUTH_PORT: 8081
      APP_PUBLIC_URL: ${APP_URL:-http://localhost:5000}
      EXTRA_ALLOWED_ORIGINS: ${EXTRA_ALLOWED_ORIGINS:-}
      AUTH_DATABASE_URL: postgresql://user:password@emnesh-auth-db:5432/emnesh_auth
      AUTH_REDIS_URL: redis://emnesh-redis:6379
      AUTH_IP_HASH_KEY: ${AUTH_IP_HASH_KEY:?AUTH_IP_HASH_KEY required}
      AUTH_ENCRYPTION_KEY: ${AUTH_ENCRYPTION_KEY:?AUTH_ENCRYPTION_KEY required}
      SESSION_ABSOLUTE_TTL: 336h
      SESSION_IDLE_TTL: 168h
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      CAPTCHA_PROVIDER: ${CAPTCHA_PROVIDER:-}
      CAPTCHA_SECRET: ${CAPTCHA_SECRET:-}
      BOOTSTRAP_ADMIN_EMAILS: ${BOOTSTRAP_ADMIN_EMAILS:-}
    depends_on:
      emnesh-auth-db:
        condition: service_healthy
      emnesh-redis:
        condition: service_healthy

  emnesh-frontend:
    container_name: emnesh-frontend
    image: nginx:alpine
    restart: always
    ports:
      - '80:80'
    volumes:
      - ./dist/public:/usr/share/nginx/html:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - emnesh-backend
      - emnesh-identity

volumes:
  pgdata_workspace:
  pgdata_auth:
  redis_data:
