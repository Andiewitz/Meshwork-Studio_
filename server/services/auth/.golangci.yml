version: "2"

linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - gosimple
    - ineffassign
    - gosec
    - misspell
    - revive
    - bodyclose
    - noctx
    - sqlclosecheck
    - rowserrcheck
  settings:
    gosec:
      excludes:
        - G404 # rand usage reviewed manually where non-crypto
  exclusions:
    rules:
      # Tests may ignore returned errors for readability.
      - path: _test\.go
        linters:
          - errcheck

formatters:
  enable:
    - gofmt
