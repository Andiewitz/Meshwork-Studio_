version: "2"

linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - gosimple
    - ineffassign
    - gosec
    - misspell
    - revive
    - bodyclose
    - noctx
    - sqlclosecheck
    - rowserrcheck

issues:
  exclude-rules:
    # Tests may ignore returned errors for readability.
    - path: _test\.go
      linters:
        - errcheck

  settings:
    gosec:
      excludes:
        - G404 # rand usage reviewed manually where non-crypto

formatters:
  enable:
    - gofmt
