version: "2"

linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
    - gosec
    - misspell
    - revive
    - bodyclose
    - noctx
    - sqlclosecheck
    - rowserrcheck
  settings:
    gosec:
      excludes:
        - G404 # rand usage reviewed manually where non-crypto
  exclusions:
    # Preserve v1's default documentation-comment exclusions during migration.
    # Runtime, security, unused-code and error-handling checks remain enabled.
    presets:
      - comments
    rules:
      # Tests may ignore returned errors for readability.
      - path: _test\.go
        linters:
          - errcheck

formatters:
  enable:
    - gofmt
